<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS-Viewer</title>
<style>
:root {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-wash: rgba(57, 135, 229, 0.10);
  --critical: #d03b3b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.top {
  max-width: 1600px;
  margin: 0 auto;
  padding: 20px 24px 4px;
}

h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}

.sub {
  margin: 2px 0 0;
  color: var(--ink-2);
}

main {
  max-width: 1600px;
  margin: 0 auto;
  padding: 8px 24px 40px;
}

.drop {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 18px;
  border: 1px dashed var(--axis);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  transition: border-color 120ms, background-color 120ms;
}

.drop:hover,
.drop.over {
  border-color: var(--accent);
  background: var(--accent-wash);
}

.drop:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.drop input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.drop-main {
  font-weight: 600;
}

.drop-sub {
  color: var(--muted);
}

.error {
  margin: 10px 0 0;
  padding: 8px 12px;
  border-left: 3px solid var(--critical);
  background: var(--surface);
  color: var(--ink);
  white-space: pre-line;
}

.error::before {
  content: "⚠ ";
}

.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 28px;
  margin: 18px 0 6px;
}

.group {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.group-label {
  color: var(--muted);
  white-space: nowrap;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip {
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink-2);
  font: inherit;
  cursor: pointer;
}

.chip:hover {
  color: var(--ink);
  border-color: var(--axis);
}

.chip[aria-selected="true"] {
  color: var(--ink);
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.chip:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.info {
  margin: 8px 0 0;
  color: var(--ink-2);
}

.hint {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 12px;
}

.charts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.charts.one {
  grid-template-columns: minmax(0, 1fr);
}

.card {
  min-width: 0;
  padding: 10px 6px 2px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

.card h2 {
  margin: 0 10px;
  font-size: 14px;
  font-weight: 600;
}

.card .plot {
  height: 330px;
}

.charts.one .card .plot {
  height: 580px;
}

.table-view {
  margin-top: 18px;
}

.table-view summary {
  color: var(--ink-2);
  cursor: pointer;
}

.table-wrap {
  overflow-x: auto;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-variant-numeric: tabular-nums;
}

th,
td {
  padding: 6px 12px;
  border-bottom: 1px solid var(--grid);
  text-align: right;
  white-space: nowrap;
}

th {
  color: var(--ink-2);
  font-weight: 600;
}

th:first-child,
td:first-child {
  text-align: left;
}

tbody tr:last-child td {
  border-bottom: none;
}

.key {
  display: inline-block;
  width: 16px;
  margin-right: 8px;
  vertical-align: middle;
  border-top-width: 2px;
  border-top-style: solid;
}

@media (max-width: 900px) {
  .charts {
    grid-template-columns: minmax(0, 1fr);
  }

  .top,
  main {
    padding-left: 12px;
    padding-right: 12px;
  }
}
</style>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
<header class="top">
  <h1>CS-Viewer</h1>
  <p class="sub">地上局のCSV（GS_000.csv など）から、ノード間の電波強度をグラフにします</p>
</header>
<main>
  <section class="load">
    <label id="drop" class="drop" for="file">
      <input id="file" type="file" accept=".csv,text/csv" multiple>
      <span class="drop-main">CSVファイルをここにドラッグ＆ドロップ</span>
      <span class="drop-sub">またはクリックして選択（複数可）</span>
    </label>
    <p id="error" class="error" role="alert" hidden></p>
  </section>
  <section id="viewer" hidden>
    <div class="controls">
      <div class="group">
        <span class="group-label">ファイル</span>
        <div id="files" class="chips" role="tablist" aria-label="読み込んだファイル"></div>
      </div>
      <div class="group">
        <span class="group-label">グラフ</span>
        <div class="chips" role="tablist" aria-label="グラフの分け方">
          <button type="button" class="chip" role="tab" data-view="pair" aria-selected="true">ペア別（6）</button>
          <button type="button" class="chip" role="tab" data-view="all" aria-selected="false">全体（1）</button>
          <button type="button" class="chip" role="tab" data-view="node" aria-selected="false">測定ノード別（4）</button>
        </div>
      </div>
    </div>
    <p id="info" class="info"></p>
    <p class="hint">ドラッグで拡大、ダブルクリックで元に戻す。凡例をクリックすると線の表示・非表示を切り替えます。</p>
    <div id="charts" class="charts"></div>
    <details class="table-view">
      <summary>数値の表（各リンクの平均・最小・最大）</summary>
      <div class="table-wrap"><table id="stats"></table></div>
    </details>
  </section>
</main>
<script>
(function () {
  'use strict';

  const NODES = ['A', 'B', 'C', 'D'];
  const LINKS = [];
  NODES.forEach(function (a, i) {
    NODES.forEach(function (b, j) {
      if (i !== j) {
        LINKS.push({ key: a + '->' + b, from: i, to: j });
      }
    });
  });
  const HEADER = ['time_s', 'gw'].concat(LINKS.map(function (l) { return l.key; }));

  const SERIES = ['#3987e5', '#d95926', '#199e70'];
  const HUE = {
    'A->B': 0, 'A->C': 1, 'A->D': 2,
    'B->A': 1, 'B->C': 0, 'B->D': 2,
    'C->A': 2, 'C->B': 1, 'C->D': 0,
    'D->A': 0, 'D->B': 1, 'D->C': 2
  };
  const DASH = ['solid', 'dot', 'dash', 'dashdot'];
  const DASH_LABEL = ['実線', '点線', '破線', '一点鎖線'];
  const GAP_S = 0.5;

  const THEME = {
    page: '#0d0d0d',
    surface: '#1a1a19',
    ink: '#ffffff',
    ink2: '#c3c2b7',
    muted: '#898781',
    grid: '#2c2c2a',
    axis: '#383835',
    border: 'rgba(255,255,255,0.10)',
    font: 'system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif'
  };

  const PLOT_CONFIG = {
    responsive: true,
    displaylogo: false,
    scrollZoom: false,
    modeBarButtonsToRemove: ['toImage', 'select2d', 'lasso2d', 'autoScale2d']
  };

  const els = {
    drop: document.getElementById('drop'),
    input: document.getElementById('file'),
    error: document.getElementById('error'),
    viewer: document.getElementById('viewer'),
    files: document.getElementById('files'),
    info: document.getElementById('info'),
    charts: document.getElementById('charts'),
    stats: document.getElementById('stats'),
    viewButtons: Array.prototype.slice.call(document.querySelectorAll('[data-view]'))
  };

  const state = {
    files: [],
    current: -1,
    view: 'pair',
    plots: [],
    syncing: false
  };

  function showMessage(text) {
    els.error.textContent = text;
    els.error.hidden = !text;
  }

  function parseCsv(text) {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/);
    const head = (lines[0] || '').split(',').map(function (s) { return s.trim(); });
    const headerOk = head.length === HEADER.length && head.every(function (h, i) { return h === HEADER[i]; });
    if (!headerOk) {
      throw new Error('1行目の列名が地上局のCSV（time_s,gw,A->B,…,D->C）と一致しません。');
    }
    const t = [];
    const gw = [];
    const cols = LINKS.map(function () { return []; });
    let skipped = 0;
    for (let n = 1; n < lines.length; n++) {
      const line = lines[n].trim();
      if (!line) {
        continue;
      }
      const f = line.split(',').map(function (s) { return s.trim(); });
      if (f.length !== HEADER.length || f.some(function (s) { return s === ''; })) {
        skipped++;
        continue;
      }
      const time = Number(f[0]);
      const vals = f.slice(2).map(Number);
      const valid = Number.isFinite(time) && NODES.indexOf(f[1]) >= 0 && vals.every(Number.isFinite);
      if (!valid) {
        skipped++;
        continue;
      }
      t.push(time);
      gw.push(f[1]);
      vals.forEach(function (v, k) { cols[k].push(v); });
    }
    if (t.length === 0) {
      throw new Error('データの行がありません。');
    }
    return { t: t, gw: gw, cols: cols, skipped: skipped };
  }

  function findSwitches(data) {
    const out = [];
    for (let i = 1; i < data.t.length; i++) {
      if (data.gw[i] !== data.gw[i - 1]) {
        out.push({ t: data.t[i], from: data.gw[i - 1], to: data.gw[i] });
      }
    }
    return out;
  }

  function withGaps(data) {
    const x = [];
    const cols = data.cols.map(function () { return []; });
    for (let i = 0; i < data.t.length; i++) {
      if (i > 0 && data.t[i] - data.t[i - 1] > GAP_S) {
        x.push((data.t[i] + data.t[i - 1]) / 2);
        cols.forEach(function (c) { c.push(null); });
      }
      x.push(data.t[i]);
      cols.forEach(function (c, k) { c.push(data.cols[k][i]); });
    }
    return { x: x, cols: cols };
  }

  function summarize(data) {
    let min = Infinity;
    let max = -Infinity;
    const links = data.cols.map(function (col) {
      let sum = 0;
      let count = 0;
      let lo = Infinity;
      let hi = -Infinity;
      let zeros = 0;
      for (let i = 0; i < col.length; i++) {
        const v = col[i];
        if (v < min) { min = v; }
        if (v > max) { max = v; }
        if (v === 0) {
          zeros++;
          continue;
        }
        sum += v;
        count++;
        if (v < lo) { lo = v; }
        if (v > hi) { hi = v; }
      }
      return {
        mean: count ? sum / count : null,
        min: count ? lo : null,
        max: count ? hi : null,
        zeros: zeros
      };
    });
    return { min: min, max: max, links: links };
  }

  function uniqueName(name) {
    const taken = state.files.map(function (f) { return f.name; });
    if (taken.indexOf(name) < 0) {
      return name;
    }
    let k = 2;
    while (taken.indexOf(name + ' (' + k + ')') >= 0) {
      k++;
    }
    return name + ' (' + k + ')';
  }

  async function addFiles(fileList) {
    const messages = [];
    const list = Array.prototype.slice.call(fileList || []);
    for (const file of list) {
      try {
        const text = await file.text();
        const data = parseCsv(text);
        state.files.push({
          name: uniqueName(file.name),
          data: data,
          plot: withGaps(data),
          switches: findSwitches(data),
          summary: summarize(data)
        });
        state.current = state.files.length - 1;
        if (data.skipped) {
          messages.push(file.name + '：形式が合わない行を ' + data.skipped + ' 行とばしました。');
        }
      } catch (err) {
        messages.push(file.name + '：読み込めませんでした。' + err.message);
      }
    }
    showMessage(messages.join('\n'));
    render();
  }

  function chartGroups() {
    const byKey = {};
    LINKS.forEach(function (l, k) { byKey[l.key] = k; });
    if (state.view === 'all') {
      return [{ title: '全12リンク', links: LINKS.map(function (l, k) { return k; }) }];
    }
    if (state.view === 'node') {
      return NODES.map(function (a, i) {
        return {
          title: a + ' が測定した値',
          links: NODES.filter(function (b, j) { return j !== i; }).map(function (b) { return byKey[a + '->' + b]; })
        };
      });
    }
    const groups = [];
    for (let i = 0; i < NODES.length; i++) {
      for (let j = i + 1; j < NODES.length; j++) {
        groups.push({
          title: NODES[i] + ' ↔ ' + NODES[j],
          links: [byKey[NODES[i] + '->' + NODES[j]], byKey[NODES[j] + '->' + NODES[i]]]
        });
      }
    }
    return groups;
  }

  function traceFor(file, k) {
    const link = LINKS[k];
    const all = state.view === 'all';
    return {
      type: 'scattergl',
      mode: 'lines',
      name: all ? link.key + '（' + DASH_LABEL[link.from] + '）' : link.key,
      x: file.plot.x,
      y: file.plot.cols[k],
      line: {
        color: SERIES[HUE[link.key]],
        width: 2,
        dash: all ? DASH[link.from] : 'solid'
      },
      hovertemplate: '<b>%{y} dBm</b>  ' + link.key + '<extra></extra>'
    };
  }

  function layoutFor(file) {
    const all = state.view === 'all';
    const s = file.summary;
    const pad = 3;
    const yRange = [s.min - pad, s.max + pad];
    const shapes = file.switches.map(function (sw) {
      return {
        type: 'line',
        xref: 'x',
        yref: 'paper',
        x0: sw.t,
        x1: sw.t,
        y0: 0,
        y1: 1,
        line: { color: THEME.ink2, width: 1 }
      };
    });
    const annotations = file.switches.map(function (sw) {
      return {
        x: sw.t,
        xref: 'x',
        y: 1,
        yref: 'paper',
        yanchor: 'top',
        xanchor: 'left',
        xshift: 4,
        showarrow: false,
        text: 'GW: ' + sw.from + '→' + sw.to,
        font: { color: THEME.ink, size: 11, family: THEME.font },
        bgcolor: THEME.surface
      };
    });
    const axisBase = {
      gridcolor: THEME.grid,
      gridwidth: 1,
      linecolor: THEME.axis,
      linewidth: 1,
      showline: true,
      zeroline: false,
      tickfont: { color: THEME.muted, size: 11 },
      title: { font: { color: THEME.muted, size: 12 } }
    };
    return {
      paper_bgcolor: THEME.surface,
      plot_bgcolor: THEME.surface,
      font: { family: THEME.font, color: THEME.ink2, size: 12 },
      margin: all ? { l: 60, r: 10, t: 16, b: 48 } : { l: 60, r: 14, t: 36, b: 48 },
      hovermode: 'x unified',
      hoverlabel: {
        bgcolor: THEME.page,
        bordercolor: THEME.border,
        font: { color: THEME.ink, family: THEME.font, size: 12 }
      },
      dragmode: 'zoom',
      showlegend: true,
      legend: all
        ? { orientation: 'v', x: 1.01, xanchor: 'left', y: 1, yanchor: 'top', font: { color: THEME.ink2, size: 12 }, bgcolor: 'rgba(0,0,0,0)' }
        : { orientation: 'h', x: 0, xanchor: 'left', y: 1.02, yanchor: 'bottom', font: { color: THEME.ink2, size: 12 }, bgcolor: 'rgba(0,0,0,0)' },
      xaxis: Object.assign({}, axisBase, {
        title: Object.assign({}, axisBase.title, { text: '時刻 [s]' }),
        hoverformat: '.1f',
        showspikes: true,
        spikemode: 'across',
        spikesnap: 'cursor',
        spikecolor: THEME.muted,
        spikethickness: 1,
        spikedash: 'solid'
      }),
      yaxis: Object.assign({}, axisBase, {
        title: Object.assign({}, axisBase.title, { text: 'RSSI [dBm]' }),
        range: yRange
      }),
      shapes: shapes,
      annotations: annotations
    };
  }

  function clearPlots() {
    state.plots.forEach(function (el) {
      if (window.Plotly) {
        Plotly.purge(el);
      }
    });
    state.plots = [];
    els.charts.textContent = '';
  }

  function syncX(source, ev) {
    if (state.syncing || state.plots.length < 2) {
      return;
    }
    let update = null;
    if (ev['xaxis.autorange']) {
      update = { 'xaxis.autorange': true };
    } else if (ev['xaxis.range[0]'] !== undefined && ev['xaxis.range[1]'] !== undefined) {
      update = { 'xaxis.range': [ev['xaxis.range[0]'], ev['xaxis.range[1]']] };
    } else if (Array.isArray(ev['xaxis.range'])) {
      update = { 'xaxis.range': ev['xaxis.range'].slice() };
    }
    if (!update) {
      return;
    }
    state.syncing = true;
    const jobs = state.plots
      .filter(function (el) { return el !== source; })
      .map(function (el) { return Plotly.relayout(el, update); });
    Promise.all(jobs).then(function () { state.syncing = false; }, function () { state.syncing = false; });
  }

  function renderCharts(file) {
    clearPlots();
    const groups = chartGroups();
    els.charts.classList.toggle('one', groups.length === 1);
    groups.forEach(function (g) {
      const card = document.createElement('div');
      card.className = 'card';
      const h = document.createElement('h2');
      h.textContent = g.title;
      const plot = document.createElement('div');
      plot.className = 'plot';
      card.appendChild(h);
      card.appendChild(plot);
      els.charts.appendChild(card);
      const traces = g.links.map(function (k) { return traceFor(file, k); });
      Plotly.newPlot(plot, traces, layoutFor(file), PLOT_CONFIG);
      plot.on('plotly_relayout', function (ev) { syncX(plot, ev); });
      state.plots.push(plot);
    });
  }

  function renderInfo(file) {
    const d = file.data;
    const first = d.gw[0];
    let gwText = 'GW: ' + first;
    if (file.switches.length) {
      gwText += ' → ' + file.switches.map(function (s) { return s.to; }).join(' → ') + '（切替 ' + file.switches.length + ' 回）';
    }
    els.info.textContent = [
      file.name,
      d.t.length.toLocaleString('ja-JP') + ' 行',
      d.t[0].toFixed(1) + '〜' + d.t[d.t.length - 1].toFixed(1) + ' 秒',
      gwText
    ].join('　｜　');
  }

  function cell(tag, text) {
    const c = document.createElement(tag);
    c.textContent = text;
    return c;
  }

  function renderStats(file) {
    els.stats.textContent = '';
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['リンク', '平均 [dBm]（0を除く）', '最小 [dBm]', '最大 [dBm]', '0 の行数'].forEach(function (t) {
      hr.appendChild(cell('th', t));
    });
    thead.appendChild(hr);
    const tbody = document.createElement('tbody');
    LINKS.forEach(function (link, k) {
      const s = file.summary.links[k];
      const tr = document.createElement('tr');
      const name = document.createElement('td');
      const key = document.createElement('span');
      key.className = 'key';
      key.style.borderTopColor = SERIES[HUE[link.key]];
      name.appendChild(key);
      name.appendChild(document.createTextNode(link.key));
      tr.appendChild(name);
      tr.appendChild(cell('td', s.mean === null ? '—' : s.mean.toFixed(1)));
      tr.appendChild(cell('td', s.min === null ? '—' : String(s.min)));
      tr.appendChild(cell('td', s.max === null ? '—' : String(s.max)));
      tr.appendChild(cell('td', s.zeros.toLocaleString('ja-JP')));
      tbody.appendChild(tr);
    });
    els.stats.appendChild(thead);
    els.stats.appendChild(tbody);
  }

  function renderFileChips() {
    els.files.textContent = '';
    state.files.forEach(function (f, i) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(i === state.current));
      b.textContent = f.name;
      b.addEventListener('click', function () {
        if (state.current !== i) {
          state.current = i;
          render();
        }
      });
      els.files.appendChild(b);
    });
  }

  function renderViewButtons() {
    els.viewButtons.forEach(function (b) {
      b.setAttribute('aria-selected', String(b.dataset.view === state.view));
    });
  }

  function render() {
    if (state.current < 0) {
      els.viewer.hidden = true;
      return;
    }
    els.viewer.hidden = false;
    const file = state.files[state.current];
    renderFileChips();
    renderViewButtons();
    renderInfo(file);
    renderStats(file);
    renderCharts(file);
  }

  function setupDrop() {
    ['dragenter', 'dragover'].forEach(function (type) {
      els.drop.addEventListener(type, function (e) {
        e.preventDefault();
        els.drop.classList.add('over');
      });
    });
    ['dragleave', 'drop'].forEach(function (type) {
      els.drop.addEventListener(type, function (e) {
        e.preventDefault();
        els.drop.classList.remove('over');
      });
    });
    els.drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    });
    ['dragover', 'drop'].forEach(function (type) {
      window.addEventListener(type, function (e) { e.preventDefault(); });
    });
    els.input.addEventListener('change', function () {
      const picked = els.input.files;
      addFiles(picked).then(function () { els.input.value = ''; });
    });
  }

  function setupViews() {
    els.viewButtons.forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.view !== b.dataset.view) {
          state.view = b.dataset.view;
          render();
        }
      });
    });
  }

  if (typeof window.Plotly === 'undefined') {
    showMessage('グラフ用ライブラリ（Plotly）を読み込めませんでした。インターネットにつながっているか確認してから、ページを再読み込みしてください。');
    els.input.disabled = true;
    return;
  }

  setupDrop();
  setupViews();
})();
</script>
</body>
</html>
